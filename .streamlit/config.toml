# Streamlit theme + behavior configuration
# Applied before the app's own CSS, so the dark palette loads instantly
# (no white flash) and matches the custom CSS variables below.

[theme]
base = "dark"
primaryColor = "#58a6ff"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"

[browser]
gatherUsageStats = false
